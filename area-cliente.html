<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Projects | Vilela Digit</title>
<meta name="robots" content="noindex, nofollow">

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%232E6E6A%22/><text x=%2250%22 y=%2266%22 font-size=%2258%22 font-family=%22Arial%22 fill=%22white%22 text-anchor=%22middle%22>V</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/area.css">
</head>
<body class="carregando">

<header class="site-header area-header">
  <div class="container header-inner">
    <a href="index.html" class="logo">Vilela<span>Digit</span></a>
    <div class="header-controls">
      <span class="area-user"><span class="area-user-nome"><strong id="usuarioNome"></strong></span><span class="area-papel" id="usuarioPapel"></span></span>
      <a href="admin.html" class="pill-btn" id="linkAdmin" hidden>Painel admin</a>
      <a href="alterar-senha.html" class="pill-btn" title="Change my password">Password</a>
      <button id="themeToggle" class="pill-btn icon-btn" aria-label="Toggle light/dark theme" title="Light / dark mode">
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
      </button>
      <button id="botaoSair" class="pill-btn">Sign out</button>
    </div>
  </div>
</header>

<main class="area-main">
  <div class="container area-wrap">

    <div class="area-titulo">
      <span class="eyebrow">Client Area</span>
      <h1 id="saudacao">My projects</h1>
      <p>Follow the progress, schedule and proposals of your projects.</p>
    </div>

    <div id="aviso" class="aviso" role="alert"></div>
    <div id="listaProjetos" class="projetos-grid"></div>

  </div>
</main>

<footer class="area-footer">
  <div class="container">© <span id="year"></span> Fernando Vilela — Vilela Digit</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/area-comum.js"></script>
<script>
(async function () {
  "use strict";
  const { sb, exigirAcesso, aviso, escapar, formatarData } = window.Area;

  const perfil = await exigirAcesso();
  if (!perfil) return;

  if (perfil.papel === "admin") document.getElementById("linkAdmin").hidden = false;
  const primeiroNome = (perfil.nome || "").split(" ")[0];
  if (primeiroNome) document.getElementById("saudacao").textContent = `Hello, ${primeiroNome}`;

  const NOMES_STATUS = {
    planejamento: "Planning",
    em_andamento: "In progress",
    pausado: "On hold",
    concluido: "Completed",
  };

  // O banco só devolve os projetos e páginas que esta pessoa pode ver (regras RLS).
  // O HTML das páginas não é baixado aqui (só título e data), para a lista abrir rápido.
  const { data: projetos, error } = await sb
    .from("projetos")
    .select("id, nome, descricao, status, paginas(id, titulo, tipo, ordem, visivel_cliente, atualizado_em)")
    .order("criado_em", { ascending: false });

  const lista = document.getElementById("listaProjetos");

  if (error) {
    aviso(document.getElementById("aviso"), "Could not load your projects: " + error.message);
    return;
  }

  if (!projetos.length) {
    lista.innerHTML = `
      <div class="card vazio" style="grid-column:1/-1">
        No projects available yet.<br>As soon as there is news, it will appear here.
      </div>`;
    return;
  }

  lista.innerHTML = projetos.map((p) => {
    const paginas = (p.paginas || []).sort((a, b) => a.ordem - b.ordem);
    const itens = paginas.length
      ? paginas.map((pg) => `
          <li>
            <a href="pagina.html?id=${pg.id}" class="link-discreto">${escapar(pg.titulo)}</a>
            <span class="data">${pg.visivel_cliente ? "" : "(hidden) "}${formatarData(pg.atualizado_em)}</span>
          </li>`).join("")
      : "<li><span>No pages published yet.</span></li>";
    return `
      <article class="card projeto-card">
        <span class="selo selo-ativo">${NOMES_STATUS[p.status] || escapar(p.status)}</span>
        <h3 style="margin-top:12px">${escapar(p.nome)}</h3>
        ${p.descricao ? `<p>${escapar(p.descricao)}</p>` : ""}
        <ul class="projeto-paginas">${itens}</ul>
      </article>`;
  }).join("");
})();
</script>
</body>
</html>
