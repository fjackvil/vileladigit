<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Area | Vilela Digit</title>
<!-- Páginas da área restrita não devem aparecer no Google -->
<meta name="robots" content="noindex, nofollow">

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%232E6E6A%22/><text x=%2250%22 y=%2266%22 font-size=%2258%22 font-family=%22Arial%22 fill=%22white%22 text-anchor=%22middle%22>V</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/area.css">
</head>
<body class="carregando">

<header class="site-header area-header">
  <div class="container header-inner">
    <a href="index.html" class="logo">Vilela<span>Digit</span></a>
    <div class="header-controls">
      <a href="index.html" class="link-discreto">← Back to website</a>
      <button id="themeToggle" class="pill-btn icon-btn" aria-label="Toggle light/dark theme" title="Light / dark mode">
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="area-main">
  <div class="container auth-wrap">
    <div class="card auth-card">
      <span class="eyebrow">Client Area</span>
      <h1>Sign in</h1>
      <p>Follow the progress of your projects.</p>

      <div id="aviso" class="aviso" role="alert"></div>

      <form id="formLogin" novalidate>
        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" autocomplete="username" required>
        </div>
        <div class="campo">
          <label for="senha">Password</label>
          <input type="password" id="senha" autocomplete="current-password" required>
        </div>
        <button type="submit" id="botaoEntrar" class="btn btn-primary btn-bloco">Sign in</button>
      </form>

      <p style="margin:18px 0 0; text-align:center">
        <button type="button" id="esqueci" class="link-discreto">Forgot your password?</button>
      </p>
    </div>
  </div>
</main>

<footer class="area-footer">
  <div class="container">© <span id="year"></span> Fernando Vilela — Vilela Digit</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/area-comum.js"></script>
<script>
(async function () {
  "use strict";
  const { sb, obterPerfil, destinoPorPerfil, aviso, traduzirErro, comBotaoOcupado } = window.Area;
  const caixaAviso = document.getElementById("aviso");
  const MSG_INATIVO = "Your access is inactive. Please contact the administrator.";

  // Se já estiver logado, vai direto para a tela certa.
  const perfilAtual = await obterPerfil();
  if (perfilAtual && perfilAtual.ativo) {
    location.replace(destinoPorPerfil(perfilAtual));
    return;
  }
  if (perfilAtual && !perfilAtual.ativo) await sb.auth.signOut();

  if (new URLSearchParams(location.search).get("motivo") === "inativo") {
    aviso(caixaAviso, MSG_INATIVO, "erro");
  }
  document.body.classList.remove("carregando");

  document.getElementById("esqueci").addEventListener("click", () => {
    aviso(caixaAviso, "Please contact Fernando Vilela by e-mail (fernando.vilela@vileladigit.com.br) or WhatsApp to receive a new temporary password.", "info");
  });

  const botao = document.getElementById("botaoEntrar");

  document.getElementById("formLogin").addEventListener("submit", async (evento) => {
    evento.preventDefault();
    aviso(caixaAviso, "");

    const email = document.getElementById("email").value.trim();
    const senha = document.getElementById("senha").value;
    if (!email || !senha) {
      aviso(caixaAviso, "Please enter your e-mail and password.");
      return;
    }

    await comBotaoOcupado(botao, "Signing in…", async () => {
      const { error } = await sb.auth.signInWithPassword({ email, password: senha });
      if (error) {
        aviso(caixaAviso, traduzirErro(error.message));
        return;
      }

      const perfil = await obterPerfil();
      if (!perfil) {
        await sb.auth.signOut();
        aviso(caixaAviso, "This user has no access to the client area.");
        return;
      }
      if (!perfil.ativo) {
        await sb.auth.signOut();
        aviso(caixaAviso, MSG_INATIVO);
        return;
      }
      location.replace(destinoPorPerfil(perfil));
    });
  });
})();
</script>
</body>
</html>
