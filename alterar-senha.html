<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change password | Vilela Digit</title>
<meta name="robots" content="noindex, nofollow">

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%232E6E6A%22/><text x=%2250%22 y=%2266%22 font-size=%2258%22 font-family=%22Arial%22 fill=%22white%22 text-anchor=%22middle%22>V</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/area.css">
</head>
<body class="carregando">

<header class="site-header area-header">
  <div class="container header-inner">
    <a href="index.html" class="logo">Vilela<span>Digit</span></a>
    <div class="header-controls">
      <span class="area-user"><span class="area-user-nome"><strong id="usuarioNome"></strong></span><span class="area-papel" id="usuarioPapel"></span></span>
      <button id="themeToggle" class="pill-btn icon-btn" aria-label="Toggle light/dark theme" title="Light / dark mode">
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
      </button>
      <button id="botaoSair" class="pill-btn">Sign out</button>
    </div>
  </div>
</header>

<main class="area-main">
  <div class="container auth-wrap">
    <div class="card auth-card">
      <span class="eyebrow">Security</span>
      <h1>Change password</h1>
      <p id="textoIntro">Choose a new password for your account.</p>

      <div id="aviso" class="aviso" role="alert"></div>

      <form id="formSenha" novalidate>
        <div class="campo">
          <label for="novaSenha">New password</label>
          <input type="password" id="novaSenha" autocomplete="new-password" minlength="8" required>
          <span class="campo-dica">At least 8 characters. Mix letters, numbers and symbols.</span>
        </div>
        <div class="campo">
          <label for="confirmarSenha">Repeat the new password</label>
          <input type="password" id="confirmarSenha" autocomplete="new-password" minlength="8" required>
        </div>
        <button type="submit" id="botaoSalvar" class="btn btn-primary btn-bloco">Save new password</button>
      </form>

      <p style="margin:18px 0 0; text-align:center" id="linkVoltar" hidden>
        <a href="#" id="voltar" class="link-discreto">← Back</a>
      </p>
    </div>
  </div>
</main>

<footer class="area-footer">
  <div class="container">© <span id="year"></span> Fernando Vilela — Vilela Digit</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/area-comum.js"></script>
<script>
(async function () {
  "use strict";
  const { sb, exigirAcesso, destinoPorPerfil, aviso, traduzirErro, comBotaoOcupado } = window.Area;

  const perfil = await exigirAcesso({ permitirTrocaPendente: true });
  if (!perfil) return;

  const caixaAviso = document.getElementById("aviso");

  if (perfil.deve_trocar_senha) {
    // Primeiro acesso (ou senha redefinida pelo admin): troca obrigatória.
    document.getElementById("textoIntro").textContent =
      "For your security, please replace the temporary password you received before continuing.";
    aviso(caixaAviso, "Password change required on first access.", "info");
  } else {
    document.getElementById("voltar").href = destinoPorPerfil(perfil);
    document.getElementById("linkVoltar").hidden = false;
  }

  const botao = document.getElementById("botaoSalvar");

  document.getElementById("formSenha").addEventListener("submit", async (evento) => {
    evento.preventDefault();
    const nova = document.getElementById("novaSenha").value;
    const confirmar = document.getElementById("confirmarSenha").value;

    if (nova.length < 8) {
      aviso(caixaAviso, "The password must have at least 8 characters.");
      return;
    }
    if (nova !== confirmar) {
      aviso(caixaAviso, "The two passwords do not match.");
      return;
    }

    await comBotaoOcupado(botao, "Saving…", async () => {
      const { error } = await sb.auth.updateUser({ password: nova });
      if (error) {
        aviso(caixaAviso, traduzirErro(error.message));
        return;
      }

      // Avisa o banco que a senha foi trocada (libera o acesso aos projetos).
      const { error: erroConfirmar } = await sb.rpc("confirmar_troca_senha");
      if (erroConfirmar) {
        aviso(caixaAviso, "Your password was changed, but access could not be released. Please sign in again.");
        return;
      }

      aviso(caixaAviso, "Password changed successfully! Redirecting…", "ok");
      document.getElementById("formSenha").reset();
      setTimeout(() => location.replace(destinoPorPerfil({ ...perfil, deve_trocar_senha: false })), 1200);
    });
  });
})();
</script>
</body>
</html>
