<!doctype html>
<html lang="en">
<head>
<!-- MODELO DE PROPOSTA (Vilela Digit). Sem dados de cliente: os dados vêm do Supabase. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proposal</title>
<style>
:root{
  --navy:#0e2a47; --navy-2:#173a5e; --accent:#2a78d6; --accent-soft:#e3eefb;
  --page:#f4f5f7; --surface:#ffffff; --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --context:#b9bec6; --border:rgba(11,11,11,.10);
  --good:#0ca30c; --good-text:#006300; --bad:#d03b3b; --warn:#fab219;
  --p1:#2a78d6; --p2:#eb6834; --p3:#1baf7a; --p4:#4a3aa7; --p5:#e87ba4; --p6:#008300; --p7:#eda100;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --accent-soft:#1c2c40; --good-text:#0ca30c; --context:#55595f;
    --p1:#3987e5; --p2:#d95926; --p3:#199e70; --p4:#9085e9; --p5:#d55181; --p6:#008300; --p7:#c98500;
  }
}
:root[data-theme="dark"]{
  --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --accent-soft:#1c2c40; --good-text:#0ca30c; --context:#55595f;
  --p1:#3987e5; --p2:#d95926; --p3:#199e70; --p4:#9085e9; --p5:#d55181; --p6:#008300; --p7:#c98500;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.45}
/* top bar */
#top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:10px 24px;background:var(--navy);color:#fff}
#top .brand{font-weight:600;letter-spacing:.5px;font-size:14px;margin-right:auto}
#top .brand small{color:#9fb6d1;font-weight:400;margin-left:8px}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.25);border-radius:7px;overflow:hidden}
.seg button{background:transparent;color:#c9d6e6;border:0;padding:6px 12px;font-size:12.5px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.btn{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:7px;padding:6px 12px;font-size:12.5px;cursor:pointer}
.btn:hover{background:rgba(255,255,255,.18)}
#nav{display:flex;gap:2px;overflow-x:auto;padding:0 24px;background:var(--navy-2);scrollbar-width:none}
#nav a{color:#b8c9dc;text-decoration:none;font-size:12.5px;padding:8px 10px;white-space:nowrap;border-bottom:2px solid transparent}
#nav a.on{color:#fff;border-bottom-color:var(--accent)}
/* slides */
main{max-width:1240px;margin:0 auto;padding:24px 24px 80px}
section.slide{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:36px 44px;margin:0 0 24px;min-height:560px;scroll-margin-top:110px;position:relative}
.kicker{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--accent);font-weight:600}
h2{font-size:28px;line-height:1.2;margin:6px 0 6px;font-weight:600;text-wrap:balance}
.lead{font-size:16px;color:var(--ink-2);max-width:880px;margin:0 0 22px}
.pg{position:absolute;right:22px;bottom:14px;font-size:11px;color:var(--muted)}
/* cover */
.cover{background:radial-gradient(ellipse at 80% 0%,#1d4f86 0%,#0e2a47 50%,#081a2d 100%) !important;color:#fff;display:flex;flex-direction:column;justify-content:center}
.cover .kicker{color:#8fb8ef}
.cover h1{font-size:46px;margin:12px 0 10px;line-height:1.1}
.cover .lead{color:#c9d6e6;font-size:18px}
.cover .meta{display:flex;gap:40px;margin-top:40px;font-size:13px;color:#9fb6d1}
.cover .meta b{display:block;color:#fff;font-size:15px;font-weight:600}
.co-logo{background:#fff;border-radius:10px;padding:8px 10px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.co-logo img{display:block;height:64px;width:auto}
.cover .co-logo{position:absolute;top:32px;right:40px}
.cover .co-logo img{height:84px}
/* generic */
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:1fr 1fr}
.tile{border:1px solid var(--border);border-radius:10px;padding:16px 18px}
.tile .l{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-2)}
.tile .v{font-size:32px;font-weight:600;line-height:1.15;margin-top:4px}
.tile .d{font-size:12.5px;color:var(--ink-2)}
.box{border:1px solid var(--border);border-radius:10px;padding:16px 18px}
.box h3{margin:0 0 8px;font-size:15px}
.box ul{margin:0;padding-left:18px;color:var(--ink-2)} .box li{margin:4px 0}
.flow{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:10px}
.flow .st{border:1px solid var(--border);border-radius:10px;padding:14px;position:relative;background:var(--surface)}
.flow .st .n{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:600}
.flow .st h4{margin:10px 0 4px;font-size:14px}
.flow .st p{margin:0;font-size:12.5px;color:var(--ink-2)}
.flow .st:not(:last-child)::after{content:"→";position:absolute;right:-12px;top:44%;color:var(--muted);font-size:16px}
table.tb{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
table.tb th{text-align:right;color:var(--ink-2);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--axis);white-space:nowrap}
table.tb td{padding:7px 10px;border-bottom:1px solid var(--grid);text-align:right;vertical-align:top}
table.tb th:first-child,table.tb td:first-child,table.tb td.l,table.tb th.l{text-align:left}
table.tb tr.tot td{font-weight:700;border-top:1px solid var(--axis);border-bottom:0}
table.tb tr.ph td{background:var(--accent-soft);font-weight:600}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:baseline}
.bar{height:12px;border-radius:0 4px 4px 0;background:var(--context)}
.bar.acc{background:var(--accent)}
.insight{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:4px;font-size:14px;margin-top:16px}
/* gantt */
.gantt{border:1px solid var(--border);border-radius:10px;overflow:hidden}
.gh,.gr{display:grid;grid-template-columns:330px 1fr}
.gh{background:var(--page);font-size:11px;color:var(--ink-2);border-bottom:1px solid var(--border)}
.gh .lab{padding:8px 12px;font-weight:600}
.months{position:relative;height:34px}
.months span{position:absolute;top:0;bottom:0;border-left:1px solid var(--border);padding:9px 6px;white-space:nowrap;overflow:hidden}
.gr{font-size:12.5px;border-bottom:1px solid var(--grid);min-height:26px}
.gr .lab{padding:4px 12px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gr.phase{background:var(--page);font-weight:600}
.gr.phase .lab{font-size:12.5px}
.track{position:relative}
.track .gl{position:absolute;top:0;bottom:0;border-left:1px dashed var(--grid)}
.gb{position:absolute;top:6px;height:14px;border-radius:4px;cursor:help;min-width:3px}
.gr.phase .gb{top:9px;height:8px;border-radius:2px;opacity:.55}
.ms{position:absolute;top:5px;width:14px;height:14px;transform:rotate(45deg);background:var(--ink);border:2px solid var(--surface);cursor:help}
.today{position:absolute;top:0;bottom:0;border-left:2px solid var(--bad)}
.lbl-h{font-variant-numeric:tabular-nums;color:var(--muted);margin-left:auto;padding-left:8px;font-weight:400}
.gr.phase{min-height:40px}
.gr.phase .gb{top:7px}
.gp{position:absolute;top:20px;height:12px;border-radius:3px;background:var(--grid);overflow:visible;cursor:help}
.gp i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.gp.end b{left:auto;right:calc(100% + 6px)}
.gp b{position:absolute;left:calc(100% + 6px);top:-2px;font-size:11px;font-weight:600;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.glg{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted);margin-top:10px}
.glg span{display:inline-flex;align-items:center;gap:6px}
.glg em{display:inline-block;width:22px;height:8px;border-radius:2px}
/* hbar chart */
.hb{display:grid;grid-template-columns:260px 1fr 120px;align-items:center;gap:10px;font-size:13.5px;margin:7px 0}
.hb .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
/* timeline months chart */
.mchart{display:flex;align-items:flex-end;gap:8px;height:200px;border-bottom:1px solid var(--axis);padding-top:20px}
.mchart .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11.5px;color:var(--ink-2)}
.mchart .c .b{width:70%;background:var(--context);border-radius:4px 4px 0 0;position:relative}
.mchart .c .b span{position:absolute;top:-18px;left:50%;transform:translateX(-50%);white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink)}
.mlabels{display:flex;gap:8px;font-size:11.5px;color:var(--ink-2);margin-top:4px}
.mlabels div{flex:1;text-align:center}
/* PT tooltip */
.tr{cursor:help;text-decoration:underline dotted transparent}
body:not(.nohint) .tr:hover{text-decoration-color:var(--muted)}
#tip{position:fixed;z-index:999;pointer-events:none;background:#111c2b;color:#fff;font-size:13px;line-height:1.4;padding:8px 11px;border-radius:7px;max-width:380px;box-shadow:0 6px 18px rgba(0,0,0,.3);opacity:0;transition:opacity .12s}
#tip.on{opacity:1}
#tip .flag{font-size:10px;letter-spacing:1px;color:#8fb8ef;display:block;margin-bottom:2px}
/* admin */
#admin{position:fixed;top:0;right:0;bottom:0;width:min(640px,100vw);background:var(--surface);border-left:1px solid var(--border);box-shadow:-12px 0 40px rgba(0,0,0,.2);z-index:100;transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
#admin.open{transform:none}
#admin header{display:flex;align-items:center;gap:10px;padding:14px 20px;background:var(--navy);color:#fff}
#admin header h3{margin:0;font-size:16px;flex:1}
#admin .body{overflow:auto;padding:18px 20px 40px}
#admin fieldset{border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin:0 0 16px}
#admin legend{font-weight:600;font-size:13.5px;padding:0 6px}
.frm{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 14px}
.frm label{display:flex;flex-direction:column;font-size:12px;color:var(--ink-2);gap:4px}
.frm input,.frm select,#admin input,#admin select{font:inherit;font-size:13.5px;padding:6px 8px;border:1px solid var(--axis);border-radius:6px;background:var(--surface);color:var(--ink);min-width:0}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days label{flex-direction:row;align-items:center;gap:3px;font-size:12.5px;color:var(--ink)}
.calc{font-size:13px;background:var(--accent-soft);border-radius:8px;padding:10px 12px;margin-top:10px;line-height:1.6}
.brl{font-variant-numeric:tabular-nums}
.stg{width:100%;border-collapse:collapse;font-size:12.5px}
.stg th{text-align:left;color:var(--ink-2);font-weight:600;padding:4px;border-bottom:1px solid var(--axis)}
.stg td{padding:3px 4px;border-bottom:1px solid var(--grid);vertical-align:middle}
.stg input[type=text]{width:100%}
.stg input[type=number]{width:62px}
.stg select{width:58px}
.ib{border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:5px;padding:2px 6px;cursor:pointer;font-size:12px}
.addrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px}
.addrow2{display:flex;gap:6px;margin-top:6px;align-items:center;flex-wrap:wrap}
.abtn{background:var(--accent);color:#fff;border:0;border-radius:7px;padding:8px 14px;cursor:pointer;font-size:13px}
.abtn.sec{background:transparent;color:var(--ink);border:1px solid var(--axis)}
/* presentation mode */
body.present #top .admin-only, body.present .admin-only{display:none !important}
body.present #nav{display:none}
#cloudSt{font-size:12px;color:#b8c9dc;white-space:nowrap}#cloudSt.ok{color:#9fe0a8}#cloudSt.err{color:#ffb4a8}
#trackView{display:none;max-width:1180px;margin:24px auto;padding:0 24px}
body.tracking #trackView{display:block} body.tracking #slides,body.tracking #nav{display:none}
body.present #trackView,body.present #trackBtn{display:none !important}
.tk-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:16px 0 22px}
.tk-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.tk-card .l{font-size:12px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em}
.tk-card .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:4px}
.tk-card .d{font-size:12.5px;color:var(--muted)}
.tk-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 22px;margin-bottom:20px}
.tk-row{display:grid;grid-template-columns:minmax(150px,240px) 1fr 150px;gap:12px;align-items:center;padding:6px 0;font-size:13px}
.tk-row .bw{position:relative;height:18px;background:var(--grid);border-radius:4px}
.tk-row .bw .e{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.tk-row .bw .a{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--ink);border-radius:2px;margin-left:-1.5px}
.tk-row .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:12.5px}
.tk-tb input{width:78px;text-align:right;font:inherit;padding:4px 6px;border:1px solid var(--axis);border-radius:6px;background:var(--surface);color:var(--ink)}
.tk-tb td{vertical-align:middle}
.tk-tb tr.ph td{font-weight:700;background:var(--accent-soft)}
.tk-lg{display:flex;flex-wrap:wrap;gap:16px;font-size:12.5px;color:var(--ink-2);margin-top:10px}
.tk-lg em{display:inline-block;width:18px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
@media (max-width:700px){.tk-row{grid-template-columns:1fr}.tk-row .n{text-align:left}}
@media print{#trackView{display:none !important}}
body.present main{max-width:none;padding:0}
body.present section.slide{display:none;min-height:100vh;margin:0;border-radius:0;border:0;padding:6vh 7vw}
body.present section.slide.cur{display:block}
body.present #top{position:fixed;top:auto;bottom:0;left:0;right:0;background:transparent;justify-content:flex-end;opacity:0;transition:opacity .2s}
body.present #top:hover{opacity:1}
body.present #top .brand{display:none}
#exitP{display:none}
body.present #exitP{display:inline-block}
@media (max-width:860px){
  main{padding:12px 16px 60px}
  section.slide{padding:22px 18px}
  .g4,.g3,.g2,.flow{grid-template-columns:1fr}
  .gh,.gr{grid-template-columns:150px 1fr}
  .hb{grid-template-columns:120px 1fr 80px}
  .frm{grid-template-columns:1fr 1fr}
  #top{flex-wrap:wrap}
  .cover h1{font-size:32px}
}
@page{size:A4 landscape;margin:10mm}
@media print{
  html,body{background:#fff !important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #top,#nav,#admin,#tip,#exitP{display:none !important}
  main{max-width:none !important;padding:0 !important;margin:0 !important}
  section.slide{display:block !important;break-after:page;page-break-after:always;break-inside:auto;margin:0 !important;border:0 !important;border-radius:0 !important;box-shadow:none !important;min-height:0 !important;padding:6mm 4mm !important;zoom:.8}
  section.slide:last-child{break-after:auto;page-break-after:auto}
  #s4{zoom:.62}
  .gr,.hb,tr,.box,.tile{break-inside:avoid}
}
</style>
</head>
<body>
<div id="top">
  <div class="brand"><span id="brandTxt"></span> <small id="brandSub"></small></div>
  <div class="seg" id="langSeg"></div>
  <button class="btn" id="hintBtn" title="Portuguese hints on hover">PT ⓘ</button>
  <button class="btn" id="pdfBtn">⬇ PDF</button>
  <button class="btn" id="trackBtn"></button>
  <button class="btn" id="presBtn"></button>
  <button class="btn" id="exitP">✕</button>
</div>
<nav id="nav"></nav>
<main id="slides"></main>
<section id="trackView" aria-label="Project progress"></section>
<div id="tip"></div>

<script>
/* =====================================================================
   MODELO DE PROPOSTA — Vilela Digit
   Este arquivo é só o VISUAL e os CÁLCULOS. Nenhum dado de cliente fica
   aqui: textos, contatos, fases, valores e andamento chegam em
   window.__DADOS__ (vindos do Supabase, colocados pela pagina.html).

   ===================================================================== */
function schedule(){
  const days=S.workDays.length||5;
  const pmFixed=Math.max(0,+S.pmHoursTotal||0);
  const prodNeed=S.stages.reduce((a,s)=>a+Math.max(0,+s.hours||0),0)*(1+(+S.reworkPct||0)/100);
  const pmDay=(prodNeed+pmFixed)>0?S.hoursPerDay*pmFixed/(prodNeed+pmFixed):0;
  const cap=Math.max(0.25,S.hoursPerDay-pmDay);
  let d=new Date(S.startDate+'T00:00:00');
  const isWork=x=>S.workDays.includes(x.getDay());
  while(!isWork(d)) d.setDate(d.getDate()+1);
  let left=cap;const res=[];const daily={};
  const addH=(dt,h)=>{const k=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');daily[k]=(daily[k]||0)+h};
  let workDaysCount=0;
  const nextDay=()=>{do{d.setDate(d.getDate()+1)}while(!isWork(d));left=cap};
  S.stages.forEach(st=>{
    let need=Math.max(0,+st.hours||0)*(1+(+S.reworkPct||0)/100);
    if(left<=0.0001) nextDay();
    const start=new Date(d);
    if(need===0){res.push({...st,start,end:new Date(d)});return}
    while(need>0.0001){const use=Math.min(left,need);need-=use;left-=use;addH(d,use);if(need>0.0001) nextDay()}
    res.push({...st,start,end:new Date(d)});
  });
  const end=new Date(d);const s0=new Date(S.startDate+'T00:00:00');const pmByMonth={};
  for(let x=new Date(s0);x<=end;x.setDate(x.getDate()+1)){if(isWork(x)){workDaysCount++;const k=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0');pmByMonth[k]=(pmByMonth[k]||0)+pmDay}}
  const pmTotal=pmFixed;const pmK=pmDay*workDaysCount>0?pmFixed/(pmDay*workDaysCount):0;Object.keys(pmByMonth).forEach(k=>pmByMonth[k]*=pmK);
  const prodHours=S.stages.reduce((a,s)=>a+(+s.hours||0),0);
  const reworkHours=prodHours*(+S.reworkPct||0)/100;
  const totalHours=prodHours+reworkHours+pmTotal;
  const weeks=workDaysCount/days;
  const phases=S.phases.map(p=>{const ss=res.filter(r=>r.phase===p.id);if(!ss.length)return null;
    const h=ss.reduce((a,s)=>a+(+s.hours||0),0);
    return {...p,start:ss[0].start,end:ss[ss.length-1].end,hours:h,stages:ss}}).filter(Boolean);
  phases.forEach(p=>{p.rw=p.hours*(+S.reworkPct||0)/100;p.pm=prodHours?pmTotal*p.hours/prodHours:0;p.total=p.hours+p.rw+p.pm;p.cost=p.total*S.rateEUR});
  phases.forEach(p=>{p.prog=p.hours?p.stages.reduce((a,s)=>a+(+s.hours||0)*pc(s.prog),0)/p.hours:0;p.actual=p.stages.reduce((a,s)=>a+(+s.actual||0),0);p.earned=p.hours*p.prog/100});
  const progress=prodHours?phases.reduce((a,p)=>a+p.hours*p.prog,0)/prodHours:0;
  const actualHours=phases.reduce((a,p)=>a+p.actual,0),earnedHours=prodHours*progress/100;
  const base=totalHours*S.rateEUR, reserve=base*S.contingencyPct/100;
  const months=Object.keys({...daily,...pmByMonth}).sort().map(k=>({k,date:new Date(k+'-01T00:00:00'),hours:(daily[k]||0)+(pmByMonth[k]||0)}));
  return {res,phases,progress,actualHours,earnedHours,start:s0,end,weeks,workDaysCount,pmTotal,prodHours,reworkHours,totalHours,base,reserve,months,cap,pmDay,
          hoursWeek:S.hoursPerDay*days,hoursMonth:S.hoursPerDay*days*52/12};
}

  const box=(k,on)=>`<div class="box" style="${on?'border-color:var(--accent);border-width:2px':''}"><h3>${WT('fat.'+k+'_titulo')}${on?` <span style="color:var(--accent)">✓ ${t(U.proposed)}</span>`:''}</h3><div style="color:var(--ink-2);font-size:14px">${WT('fat.'+k+'_texto')}</div><div style="font-size:13px;margin-top:8px">${WT('fat.'+k+'_pro')}</div></div>`;
  return `${kicker('modelos_faturamento')}
  <h2>${WT(S.billing==='monthly'?'fat.titulo_mensal':'fat.titulo_marco')}</h2>
  <div class="grid g3">${box('a',S.billing!=='monthly')}${box('b',S.billing==='monthly')}${box('c',false)}</div>
  <div class="grid g2" style="margin-top:20px;align-items:start">
   <div class="box"><h3>${W(U.modelB)}</h3>
    <div class="mchart" style="height:150px">${R.months.map(m=>`<div class="c"><div class="b" style="height:${m.hours/max*100}%"><span>${eur(m.hours*S.rateEUR)}</span></div></div>`).join('')}</div><div class="mlabels">${R.months.map(m=>`<div>${mfmt(m.date)}<br>${nf(m.hours)} h</div>`).join('')}</div></div>
   ${LST('faturamento.regras').length?`<div class="box"><h3>${W(U.billingTerms)}</h3><ul style="font-size:13.5px">${ul('faturamento.regras')}</ul></div>`:''}
  </div>`;
}
function sMaint(){
  const h=+S.maintHours||0,rate=S.rateEUR,mo=Math.max(1,+S.maintMonths||12);
  const plans=[Math.max(1,Math.round(h/2)),h,Math.round(h*1.5)];
  const emMeses={en:`in ${mo} months`,it:`in ${mo} mesi`,pt:`em ${mo} meses`};
  return `${kicker('manutencao')}
  <h2>${WT('manutencao.titulo')}</h2>
  ${tem('manutencao.lead')?`<p class="lead">${WT('manutencao.lead')}</p>`:''}
  <div class="grid g3">${plans.map((p,i)=>`<div class="tile" style="${i===1?'border:2px solid var(--accent)':''}"><div class="l">${W(U.plans[i])}${i===1?` · <span style="color:var(--accent)">${t(U.recommended)}</span>`:''}</div><div class="v" ${i===1?'style="color:var(--accent)"':''}>${eur(p*rate)}<span style="font-size:15px;color:var(--ink-2)"> /${t(U.month)}</span></div><div class="d">${nf(p)} h/${t(U.month)} · ${eur(p*rate*mo)} ${W(emMeses)}</div></div>`).join('')}</div>
  <div class="grid g2" style="margin-top:20px;align-items:start">
   ${LST('manutencao.inclui').length?`<div class="box"><h3>${W(U.included)}</h3><ul style="font-size:13.5px">${ul('manutencao.inclui')}</ul></div>`:''}
   ${LST('manutencao.condicoes').length?`<div class="box"><h3>${W(U.terms)}</h3><ul style="font-size:13.5px">${ul('manutencao.condicoes')}</ul></div>`:''}
  </div>`;
}
function sPrereq(){
  const it=LST('prerequisitos.itens');
  return `${kicker('prerequisitos')}
  <h2>${WT('prerequisitos.titulo')}</h2>
  ${tem('prerequisitos.lead')?`<p class="lead">${WT('prerequisitos.lead')}</p>`:''}
  ${it.length?`<table class="tb"><thead><tr><th class="l">${W(U.item)}</th><th class="l">${W(U.detail)}</th><th class="l">${W(U.providedBy)}</th></tr></thead><tbody>
  ${it.map(r=>`<tr><td class="l"><b>${WP(r.item)}</b></td><td class="l">${WP(r.detalhe)}</td><td class="l">${WP(r.responsavel)}</td></tr>`).join('')}</tbody></table>`:''}
  ${tem('prerequisitos.insight')?`<div class="insight">${WT('prerequisitos.insight')}</div>`:''}`;
}
function sNext(R){
  const st=LST('proximos.passos'),C=D.consultor,K=D.cliente;
  return `${kicker('proximos')}
  <h2>${WT('proximos.titulo')}</h2>
  ${tem('proximos.lead')?`<p class="lead">${WT('proximos.lead')}</p>`:''}
  ${st.length?`<div class="grid" style="grid-template-columns:repeat(${Math.min(5,st.length)},1fr)">${st.map((s,i)=>`<div class="tile"><div class="v" style="color:var(--accent)">${i+1}</div><div style="font-size:15px;margin-top:6px">${WP(s)}</div></div>`).join('')}</div>`:''}
  <div class="grid g3" style="margin-top:24px">
   <div class="tile"><div class="l">${W(U.duration)}</div><div class="v">${nf(R.weeks,0)} ${t(U.wk)}</div></div>
   <div class="tile"><div class="l">${W(U.effort)}</div><div class="v">${nf(R.totalHours)} h</div></div>
   <div class="tile"><div class="l">${W(U.investment)}</div><div class="v" style="color:var(--accent)">${eur(R.base)}</div></div>
  </div>
  <div class="box" style="margin-top:26px;display:flex;gap:28px;flex-wrap:wrap;align-items:center"><div class="co-logo" style="border:1px solid var(--border)"><img src="${LOGO}" alt="Vilela Digit"></div><div><b style="font-size:17px">${esc(C.nome)}</b><div style="color:var(--ink-2)">${esc(t(C.cargo))}</div><div style="margin-top:6px;font-size:13.5px"><b>${esc(C.empresa)}</b>${C.cnpj?`<br>${W(U.taxId)}: ${esc(C.cnpj)}`:''}<br><span style="color:var(--ink-2)">${esc(C.endereco1)}<br>${esc(C.endereco2)}</span></div></div>${C.telefone?`<div>${W(U.phone)}<br><a href="tel:${esc(String(C.telefone).replace(/[^+\d]/g,''))}" style="color:var(--accent);font-weight:600">${esc(C.telefone)}</a></div>`:''}${C.email?`<div>E-mail<br><a href="mailto:${esc(C.email)}" style="color:var(--accent);font-weight:600">${esc(C.email)}</a></div>`:''}</div>
  ${K.contatos.length?`<div class="box" style="margin-top:12px;display:flex;gap:28px;flex-wrap:wrap;align-items:baseline"><div><b style="font-size:15px">${W(U.clientContacts)}</b><div style="color:var(--ink-2)">${esc(K.nome)}</div></div>${K.contatos.map(c=>`<div><b>${esc(c.nome)}</b>${c.email?`<br><a href="mailto:${esc(c.email)}" style="color:var(--accent)">${esc(c.email)}</a>`:''}</div>`).join('')}</div>`:''}`;
}

/* =====================================================================
   ANDAMENTO (o que o cliente vê no botão "Progress")
   ===================================================================== */
function trackGantt(R){
  const s0=R.start.getTime(),span=Math.max(1,R.end.getTime()-s0+864e5),pos=d=>(d.getTime()-s0)/span*100,day=100*864e5/span;
  const today=new Date();today.setHours(0,0,0,0);const tp=pos(today);
  let mh='';const m=new Date(R.start.getFullYear(),R.start.getMonth(),1);
  while(m<=R.end){const l=Math.max(0,pos(m)),nx=new Date(m.getFullYear(),m.getMonth()+1,1),r=Math.min(100,pos(nx));mh+=`<span style="left:${l}%;width:${r-l}%">${mfmt(m)}</span>`;m.setMonth(m.getMonth()+1)}
  const tl=tp>=0&&tp<=100?`<i style="position:absolute;top:0;bottom:0;left:${tp}%;width:2px;background:#d03b3b;z-index:2" title="${esc(t(U.tkToday))}"></i>`:'';
  const bar=(o,c,pg,ph)=>{const L0=pos(o.start),Wd=Math.max(.4,pos(o.end)-pos(o.start)+day);const late=pg<100&&today>o.end;
    return `<div class="gb" style="left:${L0}%;width:${Wd}%;background:var(${c});opacity:.25${ph?';top:9px;height:8px':''}"></div>${pg>0?`<div class="gb" style="left:${L0}%;width:${Wd*pg/100}%;background:var(${c})${ph?';top:9px;height:8px':''}"></div>`:''}<span style="position:absolute;top:50%;transform:translateY(-50%);${L0+Wd>86?`right:${100-L0+0.5}%`:`left:calc(${L0+Wd}% + 6px)`};font-size:11px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;color:${late?'#b3261e':'var(--ink)'}">${pg>=100?'✓ ':''}${nf(pg,0)}%${late?' · '+esc(t(U.tkLate)):''}</span>`};
  let rows='';
  R.phases.forEach(p=>{rows+=`<div class="gr phase"><div class="lab"><span class="sw" style="background:var(${p.c})"></span>${esc(t(p))}<span class="lbl-h">${nf(p.hours,0)} h</span></div><div class="track">${tl}${bar(p,p.c,pc(p.prog),1)}</div></div>`;
    p.stages.forEach(s=>{rows+=`<div class="gr"><div class="lab" style="padding-left:30px" title="${esc(t(s))}">${esc(t(s))}<span class="lbl-h">${nf(+s.hours||0,0)} h</span></div><div class="track">${tl}${bar(s,p.c,pc(s.prog),0)}</div></div>`})});
  return `<div class="gantt"><div class="gh"><div class="lab">${esc(t(U.phaseStage))}</div><div class="months">${mh}</div></div>${rows}</div>
  <div class="tk-lg"><span><em style="background:var(--p4);opacity:.25"></em>${esc(t(U.planned))}</span><span><em style="background:var(--p4)"></em>${esc(t(U.tkDone))} (%)</span><span><em style="background:#d03b3b;width:2px;height:14px"></em>${esc(t(U.tkToday))}</span><span>${esc(t(U.tkLateNote))}</span></div>`;
}
function renderTrack(R){
  const gasto=S.mostrarHorasGastas===true;
  const today=new Date();today.setHours(0,0,0,0);
  const prox=R.res.filter(r=>r.ms&&pc(r.prog)<100).sort((a,b)=>a.end-b.end)[0];
  const mx=Math.max(1,...R.phases.map(p=>p.hours));
  const barra=p=>`<div class="tk-row"><div>${esc(t(p))}</div><div class="bw"><div style="position:absolute;left:0;top:0;bottom:0;width:${p.hours/mx*100}%;background:var(${p.c});opacity:.22;border-radius:4px"></div><div class="e" style="width:${p.earned/mx*100}%;background:var(${p.c})"></div></div><div class="n">${nf(p.prog,0)}% · ${dfmt(p.end)}</div></div>`;
  const linhas=R.phases.map(p=>`<tr class="ph"><td>${esc(t(p))}</td><td>${nf(p.hours,0)}</td><td>${nf(p.prog,0)}%</td><td>${dfmt(p.end)}</td>${gasto?`<td>${nf(p.actual,1)}</td>`:''}</tr>`+p.stages.map(s=>`<tr><td style="padding-left:24px">${esc(t(s))}${s.ms?' ◆':''}</td><td>${nf(+s.hours||0,0)}</td><td>${nf(pc(s.prog),0)}%</td><td style="${pc(s.prog)<100&&today>s.end?'color:#b3261e;font-weight:600':''}">${dfmt(s.end)}</td>${gasto?`<td>${nf(+s.actual||0,1)}</td>`:''}</tr>`).join('')).join('');
  document.getElementById('trackView').innerHTML=`
  <div class="kicker">${esc(t(U.tkKicker))}</div>
  <h2 style="margin:4px 0 0">${esc(t(U.tkTitle))}</h2>
  <p class="lead" style="margin-top:6px">${esc(t(U.tkLead))}</p>
  <div class="tk-cards">
   <div class="tk-card"><div class="l">${esc(t(U.tkOverall))}</div><div class="v" style="color:var(--accent)">${nf(R.progress,0)}%</div><div class="d">${nf(R.earnedHours,0)} / ${nf(R.prodHours,0)} h</div></div>
   <div class="tk-card"><div class="l">${esc(t(U.start))} → ${esc(t(U.golive))}</div><div class="v" style="font-size:20px">${dfmt(R.start)}</div><div class="d">→ ${dfmt(goLive(R))}</div></div>
   ${prox?`<div class="tk-card"><div class="l">${esc(t(U.tkNext))}</div><div class="v" style="font-size:20px">${dfmt(prox.end)}</div><div class="d">◆ ${esc(t(prox.ms))}</div></div>`:''}
   ${gasto?`<div class="tk-card"><div class="l">${esc(t(U.tkSpent))}</div><div class="v">${nf(R.actualHours,1)} h</div></div>`:''}
  </div>
  <div class="tk-box">${R.phases.map(barra).join('')}</div>
  <div class="tk-box"><h3 style="margin:0 0 10px;font-size:16px">${esc(t(U.tkGantt))}</h3>${trackGantt(R)}</div>
  <div class="tk-box"><h3 style="margin:0 0 10px;font-size:16px">${esc(t(U.tkStages))}</h3>
   <table class="tb tk-tb"><thead><tr><th class="l">${esc(t(U.stage))}</th><th>${esc(t(U.tkPlannedH))}</th><th>${esc(t(U.complete))}</th><th>${esc(t(U.tkPlannedEnd))}</th>${gasto?`<th>${esc(t(U.tkSpent))}</th>`:''}</tr></thead><tbody>${linhas}
   <tr class="tot"><td>${esc(t(U.total))}</td><td>${nf(R.prodHours,0)}</td><td>${nf(R.progress,0)}%</td><td>${dfmt(R.end)}</td>${gasto?`<td>${nf(R.actualHours,1)}</td>`:''}</tr></tbody></table>
  </div>`;
}

/* =====================================================================
   INTERFACE: idioma, dicas em PT, PDF, andamento, modo apresentação
   ===================================================================== */
document.getElementById('langSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;lang=b.dataset.lang;render()});
document.getElementById('hintBtn').onclick=()=>{hints=!hints;document.body.classList.toggle('nohint',!hints);document.getElementById('hintBtn').style.opacity=hints?1:.5};
document.getElementById('pdfBtn').onclick=()=>{const wasP=document.body.classList.contains('present');if(wasP)exitPresent();if(document.body.classList.contains('tracking'))document.getElementById('trackBtn').click();setTimeout(()=>{try{window.print()}catch(e){alert('Use Ctrl+P / Cmd+P → "Save as PDF".')}},wasP?300:50)};
document.getElementById('trackBtn').onclick=()=>{const on=document.body.classList.toggle('tracking');document.getElementById('trackBtn').classList.toggle('on',on);render();window.scrollTo(0,0)};
let curSlide=0;
function showSlide(i){const ss=document.querySelectorAll('section.slide');curSlide=Math.max(0,Math.min(ss.length-1,i));ss.forEach((s,j)=>s.classList.toggle('cur',j===curSlide))}
document.getElementById('presBtn').onclick=()=>{
  if(document.body.classList.contains('tracking'))document.getElementById('trackBtn').click();
  let best=0;document.querySelectorAll('section.slide').forEach((s,i)=>{if(s.getBoundingClientRect().top<innerHeight*0.45)best=i});
  document.body.classList.add('present');showSlide(best);
  try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}catch(e){}
};
function exitPresent(){document.body.classList.remove('present');document.querySelectorAll('section.slide').forEach(s=>s.classList.remove('cur'));try{document.fullscreenElement&&document.exitFullscreen()}catch(e){};setTimeout(()=>document.getElementById('s'+curSlide)?.scrollIntoView(),50)}
document.getElementById('exitP').onclick=exitPresent;
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.body.classList.contains('present'))exitPresent()});
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,select,textarea'))return;
  if(!document.body.classList.contains('present'))return;
  if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();showSlide(curSlide+1)}
  if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();showSlide(curSlide-1)}
  if(e.key==='Escape')exitPresent();
});
document.addEventListener('click',e=>{if(document.body.classList.contains('present')&&e.target.closest('section.slide')&&!e.target.closest('.tr')){showSlide(curSlide+(e.clientX>innerWidth/2?1:-1))}});
addEventListener('scroll',()=>{if(document.body.classList.contains('present'))return;let a=0;document.querySelectorAll('section.slide').forEach((s,i)=>{if(s.getBoundingClientRect().top<160)a=i});document.querySelectorAll('#nav a').forEach((l,i)=>l.classList.toggle('on',i===a))},{passive:true});
const tip=document.getElementById('tip');
document.addEventListener('mouseover',e=>{const el=e.target.closest('[data-pt]');if(!el||!hints||lang==='pt'){tip.classList.remove('on');return}
  tip.innerHTML=`<span class="flag">PT-BR</span>${esc(el.dataset.pt)}`;tip.classList.add('on')});
document.addEventListener('mousemove',e=>{if(!tip.classList.contains('on'))return;const x=Math.min(e.clientX+14,innerWidth-tip.offsetWidth-8),y=e.clientY+18+tip.offsetHeight>innerHeight?e.clientY-tip.offsetHeight-10:e.clientY+18;tip.style.left=x+'px';tip.style.top=y+'px'});

/* Pré-visualização ao vivo: o editor do painel admin envia os dados novos sem recarregar. */
addEventListener('message',e=>{if(e.source!==parent)return;const m=e.data||{};if(m.tipo!=='vd-dados')return;
  D=normalizar(m.dados);S=D.config;if(!D.idiomas.includes(lang))lang=D.idiomaPadrao;render()});

render();
</script>
